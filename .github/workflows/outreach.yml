name: Outreach agent

on:
  schedule:
    # Alicante = Europe/Madrid (CET/CEST). The timezone key makes GitHub follow daylight saving by itself.
    - cron: "0 9 * * *"     # 09:00 Alicante: Europe is starting its day
      timezone: "Europe/Madrid"
    - cron: "0 21 * * *"    # 21:00 Alicante: America is starting its day
      timezone: "Europe/Madrid"
  workflow_dispatch:         # started from Telegram (api/telegram.js) or by hand
    inputs:
      action:
        description: "search = scan and send cards, send = send one confirmed email"
        type: choice
        options: [search, send]
        default: search
      query:
        description: "Optional custom search query (Telegram: /search <query>)"
        type: string
        default: ""
      lead_id:
        description: "Lead id for action=send (from the Telegram button)"
        type: string
        default: ""
      scheduled:
        description: "true when started by the external 09:00/21:00 trigger (api/cron.js): sends the morning digest"
        type: string
        default: ""

permissions:
  contents: write            # needed to commit agent/tracker.json and agent/pending.json back

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - run: pip install -r agent/requirements.txt

      - name: Check secrets (names only, values are never printed)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
        run: |
          for name in ANTHROPIC_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "::warning::$name is NOT set in repository secrets"; fi
          done
          # Gmail: either secret name works (GMAIL_APP_PASSWORD is preferred)
          if [ -n "$GMAIL_APP_PASSWORD" ] || [ -n "$GMAIL_CREDENTIALS" ]; then echo "Gmail secret: set"; else echo "::warning::Neither GMAIL_APP_PASSWORD nor GMAIL_CREDENTIALS is set"; fi

      - name: Run agent
        run: python agent/scraper.py
        env:
          # Inputs go through env (never interpolated into the shell command) to avoid script injection.
          ACTION: ${{ inputs.action || 'search' }}
          SEARCH_QUERY: ${{ inputs.query }}
          LEAD_ID: ${{ inputs.lead_id }}
          SCHEDULED: ${{ inputs.scheduled }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Persist state (prevents duplicate outreach, keeps drafts for the Send button)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/tracker.json agent/pending.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update outreach state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
