name: Outreach agent

on:
  schedule:
    - cron: "0 9 * * *"     # every day at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write            # needed to commit agent/tracker.json back

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - run: pip install -r agent/requirements.txt

      - name: Check secrets (names only, values are never printed)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
        run: |
          for name in ANTHROPIC_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID GMAIL_CREDENTIALS; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "::warning::$name is NOT set in repository secrets"; fi
          done

      - name: Run lead hunter
        run: python agent/scraper.py
        env:
          # Emails are only sent when the repository variable DRY_RUN is set to "false".
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Persist tracker (prevents duplicate outreach)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/tracker.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update outreach tracker [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
