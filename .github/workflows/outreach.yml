name: Outreach agent

on:
  schedule:                # james autopilot: posts + stories to Instagram and the Facebook Page (UTC)
    - cron: "0 15 * * 1"      # monday 10:00 ET (11:00 EDT): weekly strategy + reel concepts + linkedin drafts
    - cron: "30 14 * * 1-6"   # 10:30 ET mon-sat: comment drafts for the day (engage)
    # ar02 publishing slots, 09:00 and 21:00 America/New_York. UTC is fixed, New York is not, so each slot has a winter and a
    # summer UTC hour; agent/ar02.py only acts when the New York clock is inside the slot window and never twice per slot.
    - cron: "0 14 * * *"      # 09:00 EST (winter) / 10:00 EDT
    - cron: "0 13 * * *"      # 08:00 EST (ignored) / 09:00 EDT (summer)
    - cron: "0 2 * * *"       # 21:00 EST (winter) / 22:00 EDT
    - cron: "0 1 * * *"       # 20:00 EST (ignored) / 21:00 EDT (summer)
  # Publishing: GitHub schedule above (self-contained, DST-aware through agent/ar02.py) plus an optional exact-time backup,
  # the external trigger /api/cron?action=autopilot (cron-job.org, timezone America/New_York). Double triggers are harmless.
  workflow_dispatch:         # started by /api/cron, Telegram (api/telegram.js) or by hand
    inputs:
      action:
        description: "search = scan and send cards, send = send one confirmed email, strategy = weekly US/EU lead plan, content = weekly reel concepts"
        type: choice
        options: [search, send, strategy, content, publish, autopilot, reeltest, linkedin, weekly, audit, engage]
        default: search
      query:
        description: "Optional custom search query (Telegram: /search <query>)"
        type: string
        default: ""
      lead_id:
        description: "Lead id for action=send (from the Telegram button)"
        type: string
        default: ""
      scheduled:
        description: "true when started by the external 09:00/21:00 trigger (api/cron.js): sends the morning digest"
        type: string
        default: ""

permissions:
  contents: write            # needed to commit agent/tracker.json and agent/pending.json back

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - run: pip install -r agent/requirements.txt

      - name: Check secrets (names only, values are never printed)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
        run: |
          for name in ANTHROPIC_API_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "::warning::$name is NOT set in repository secrets"; fi
          done
          # Gmail: either secret name works (GMAIL_APP_PASSWORD is preferred)
          if [ -n "$GMAIL_APP_PASSWORD" ] || [ -n "$GMAIL_CREDENTIALS" ]; then echo "Gmail secret: set"; else echo "::warning::Neither GMAIL_APP_PASSWORD nor GMAIL_CREDENTIALS is set"; fi

      - name: Run agent
        run: python agent/scraper.py
        env:
          # Inputs go through env (never interpolated into the shell command) to avoid script injection.
          ACTION: ${{ inputs.action || (github.event.schedule == '0 15 * * 1' && 'weekly') || (github.event.schedule == '30 14 * * 1-6' && 'engage') || (github.event_name == 'schedule' && 'autopilot') || 'search' }}
          SEARCH_QUERY: ${{ inputs.query }}
          LEAD_ID: ${{ inputs.lead_id }}
          SCHEDULED: ${{ inputs.scheduled }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          META_PUBLISH_LIVE: ${{ secrets.META_PUBLISH_LIVE }}

      - name: Persist state (prevents duplicate outreach, keeps drafts for the Send button)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/tracker.json agent/pending.json content-hub/weekly content-hub/publish_queue.json content-hub/autopilot_state.json content-hub/engage_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update outreach state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
