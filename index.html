<!DOCTYPE html>
<html lang="en" data-theme="light" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rustam — UI/UX & Interactive Web Developer</title>
<meta name="description" content="Crafting high-converting digital products and custom interactive systems. Bespoke UI/UX, complex CRM dashboards and Tilda Zero Block solutions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- Design tokens ---------- */
  :root, [data-theme="light"] {
    --bg: #F5F5F7;
    --card: #FFFFFF;
    --card-2: #FBFBFD;
    --line: rgba(0, 0, 0, .08);
    --line-hi: rgba(0, 0, 0, .18);
    --text: #1D1D1F;
    --muted: #86868B;
    --body: #424245;
    --accent: #0071E3;
    --accent-hover: #0077ED;
    --on-accent: #FFFFFF;
    --fill: rgba(0, 0, 0, .05);
    --seg-thumb: #FFFFFF;
    --chip-on-bg: #1D1D1F;
    --chip-on-text: #FFFFFF;
    --header-bg: rgba(255, 255, 255, .8);
    --shadow: 0 4px 24px rgba(0, 0, 0, .04);
    --shadow-hi: 0 14px 44px rgba(0, 0, 0, .10);
    --obsidian: linear-gradient(155deg, #2A2A2D 0%, #1D1D1F 55%, #131315 100%);
    --obs-text: #F5F5F7;
    --obs-muted: #A1A1A6;
    --blue-card: linear-gradient(155deg, #2B8CF0 0%, #0071E3 55%, #0058B8 100%);
    --modal-bg: #FFFFFF;
    --overlay: rgba(0, 0, 0, .35);
  }
  [data-theme="dark"] {
    --bg: #000000;
    --card: #1C1C1E;
    --card-2: #232326;
    --line: rgba(255, 255, 255, .10);
    --line-hi: rgba(255, 255, 255, .24);
    --text: #F5F5F7;
    --muted: #98989D;
    --body: #C7C7CC;
    --accent: #0A84FF;
    --accent-hover: #409CFF;
    --fill: rgba(255, 255, 255, .08);
    --seg-thumb: #3A3A3C;
    --chip-on-bg: #F5F5F7;
    --chip-on-text: #1D1D1F;
    --header-bg: rgba(0, 0, 0, .72);
    --shadow: 0 4px 24px rgba(0, 0, 0, .5);
    --shadow-hi: 0 14px 44px rgba(0, 0, 0, .7);
    --obsidian: linear-gradient(155deg, #303033 0%, #232325 55%, #161618 100%);
    --modal-bg: #1C1C1E;
    --overlay: rgba(0, 0, 0, .6);
  }
  :root { --radius: 22px; --font: "Inter", system-ui, "Segoe UI", Roboto, sans-serif; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text);
    font-family: var(--font); font-weight: 400; line-height: 1.6;
    min-height: 100vh; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    transition: background-color .4s, color .4s;
  }
  h1, h2, h3, h4 { font-family: var(--font); font-weight: 700; letter-spacing: -.03em; }
  a { color: inherit; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px 80px; }

  /* ---------- Sticky header ---------- */
  header.top {
    position: sticky; top: 0; z-index: 30;
    background: var(--header-bg);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line); transition: background-color .4s;
  }
  .top-in { max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .brand b { font-size: 1.02rem; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
  .brand b span { color: var(--muted); font-weight: 500; }
  .brand small { font-size: .74rem; color: var(--muted); font-weight: 500; }
  .top-right { display: flex; align-items: center; gap: 10px; }
  .status {
    display: inline-flex; align-items: center; gap: 9px; padding: 7px 14px; border-radius: 999px;
    background: var(--fill); font-size: .76rem; font-weight: 500; color: var(--body); white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #30D158; position: relative; flex: none; }
  .dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid #30D158; animation: pulse 2s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }

  /* language segmented switch */
  .seg { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 999px; background: var(--fill); }
  .seg-thumb { position: absolute; top: 3px; left: 3px; width: calc(50% - 3px); height: calc(100% - 6px); border-radius: 999px; background: var(--seg-thumb); box-shadow: 0 1px 4px rgba(0, 0, 0, .15); transition: transform .35s cubic-bezier(.3, .9, .3, 1); }
  [data-lang="ru"] .seg-thumb { transform: translateX(100%); }
  .seg button { position: relative; z-index: 1; width: 40px; height: 30px; border: none; background: none; cursor: pointer; font: 600 .74rem var(--font); letter-spacing: .02em; color: var(--muted); transition: color .3s; }
  .seg button[aria-pressed="true"] { color: var(--text); }

  .theme-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--fill); color: var(--text);
    cursor: pointer; display: grid; place-items: center; transition: background .3s, transform .3s;
  }
  .theme-btn:hover { transform: scale(1.06); }
  .theme-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .theme-btn .moon { display: none; }
  [data-theme="dark"] .theme-btn .sun { display: none; }
  [data-theme="dark"] .theme-btn .moon { display: block; }

  /* ---------- Filter bar ---------- */
  .filterbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin: 24px 0 18px; }
  .eyebrow { font-size: .78rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    appearance: none; background: var(--card); color: var(--text); cursor: pointer;
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px;
    font: 500 .84rem var(--font); letter-spacing: -.01em; transition: background .3s, color .3s, border-color .3s, transform .3s;
  }
  .chip:hover { border-color: var(--line-hi); transform: scale(1.03); }
  .chip.active { background: var(--chip-on-bg); color: var(--chip-on-text); border-color: transparent; }
  .chip .count { opacity: .5; margin-left: 7px; font-size: .76rem; }
  :is(.chip, .card, .modal-close, .nav-btn, .theme-btn, .tool, .btn, .opt, .seg button, .hero-cta):focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }

  /* ---------- Bento grid (tablet / mobile base) ---------- */
  .bento { display: grid; gap: 14px; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 200px; grid-auto-flow: dense; }
  .card {
    position: relative; overflow: hidden; cursor: pointer; min-width: 0; min-height: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    transition: box-shadow .35s, border-color .35s, background-color .4s;
  }
  .card:hover { box-shadow: var(--shadow-hi); border-color: var(--line-hi); }
  .w2 { grid-column: span 2; } .h2 { grid-row: span 2; }

  .row { display: flex; align-items: center; gap: 10px; }
  .tag { font-size: .74rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
  .badge { font-size: .66rem; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 9px; letter-spacing: .02em; }
  .card h3 { font-size: 1.28rem; line-height: 1.15; font-weight: 700; }
  .card p.sub { color: var(--muted); font-size: .86rem; font-weight: 500; margin-top: 5px; line-height: 1.4; }
  .more {
    position: absolute; top: 16px; right: 16px; width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center; background: var(--fill); color: var(--text); font-size: .85rem;
    opacity: 0; transform: scale(.8); transition: .3s;
  }
  .card:hover .more, .card:focus-visible .more { opacity: 1; transform: none; }
  .ico { width: 34px; height: 34px; padding: 7px; border-radius: 10px; background: var(--fill); fill: none; stroke: var(--text); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .card.feature { background: var(--obsidian); border-color: rgba(255, 255, 255, .06); }
  .card.feature .tag, .card.feature p.sub { color: var(--obs-muted); }
  .card.feature h3, .card.feature h1 { color: var(--obs-text); }
  .card.blue { background: var(--blue-card); border-color: transparent; }
  .card.blue .tag, .card.blue h3, .card.blue p.sub { color: #fff; } .card.blue p.sub { opacity: .88; }
  .card.blue .ico { background: rgba(255, 255, 255, .2); stroke: #fff; }
  .card.blue .more { background: rgba(255, 255, 255, .22); color: #fff; }
  .card.blue .btn { background: #fff; color: #0058B8; }
  .card.blue .btn.ghostw { background: rgba(255, 255, 255, .2); color: #fff; }
  .card.blue .btn:hover { background: #fff; }
  .card.blue .btn.ghostw:hover { background: rgba(255, 255, 255, .3); }

  /* Hero */
  .hero-card { padding: 30px; gap: 12px; }
  .hero-card h1 { font-size: clamp(2rem, 3.4vw, 3.1rem); line-height: 1.05; font-weight: 800; letter-spacing: -.035em; }
  .hero-card h1 .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
  .hero-card h1 .w > span { display: inline-block; }
  .hero-card .lead { color: var(--obs-muted); font-size: .98rem; font-weight: 500; max-width: 560px; line-height: 1.5; }
  .hero-card .tag { color: var(--obs-muted); }
  .adv { display: flex; flex-wrap: wrap; gap: 7px; }
  .adv span {
    font-size: .76rem; font-weight: 500; color: var(--obs-text); white-space: nowrap;
    padding: 5px 12px; border-radius: 999px; background: rgba(255, 255, 255, .09); border: 1px solid rgba(255, 255, 255, .12);
  }
  .hero-foot { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

  /* Stack */
  .tools { display: flex; flex-wrap: wrap; gap: 7px; }
  .tool {
    border: none; border-radius: 999px; padding: 6px 14px; background: var(--fill);
    color: var(--text); font: 500 .8rem var(--font); cursor: pointer; transition: background .3s, color .3s, transform .3s;
  }
  .tool:hover { transform: scale(1.05); }
  .tool.on { background: var(--accent); color: var(--on-accent); }
  .tool-note { font-size: .82rem; color: var(--muted); font-weight: 500; line-height: 1.4; min-height: 2.4em; }

  /* Case art */
  .art { flex: 1; min-height: 0; border-radius: 14px; position: relative; overflow: hidden; }
  .art > i { position: absolute; display: block; }
  .art-1 { background: linear-gradient(135deg, #2A2A2D, #1D1D1F); }
  .art-1 > i:nth-child(1) { left: 12%; top: 20%; width: 34%; height: 12%; background: #0A84FF; border-radius: 8px; }
  .art-1 > i:nth-child(2) { left: 12%; top: 42%; width: 62%; height: 6%; background: rgba(255, 255, 255, .35); border-radius: 6px; }
  .art-1 > i:nth-child(3) { left: 12%; top: 56%; width: 46%; height: 6%; background: rgba(255, 255, 255, .18); border-radius: 6px; }
  .art-2 { background: linear-gradient(135deg, #EEF4FD, #D6E6FA); }
  .art-2 > i { border-radius: 12px; background: #fff; box-shadow: 0 6px 20px rgba(0, 113, 227, .15); }
  .art-2 > i:nth-child(1) { left: 10%; top: 16%; width: 40%; height: 34%; }
  .art-2 > i:nth-child(2) { left: 54%; top: 16%; width: 36%; height: 20%; background: #0071E3; }
  .art-2 > i:nth-child(3) { left: 24%; top: 56%; width: 56%; height: 24%; }

  /* CRM dashboard mock */
  .crm-art { display: flex; gap: 8px; padding: 8px; background: var(--fill); border: 1px solid var(--line); }
  .crm-side { width: 15%; border-radius: 10px; background: #1D1D1F; padding: 8px 6px; display: flex; flex-direction: column; gap: 6px; }
  .crm-side span { height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .28); }
  .crm-side span:first-child { background: #0A84FF; }
  .crm-main { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .crm-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .crm-kpis span { height: 30px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); position: relative; }
  .crm-kpis span::after { content: ""; position: absolute; left: 8px; top: 9px; width: 45%; height: 6px; border-radius: 3px; background: var(--muted); opacity: .45; }
  .crm-kpis span:first-child::after { background: var(--accent); opacity: 1; }
  .crm-chart { flex: 1; min-height: 0; border-radius: 10px; background: var(--card); border: 1px solid var(--line); display: flex; align-items: flex-end; gap: 5%; padding: 10px 10px 8px; }
  .crm-chart span {
    flex: 1; height: var(--h); border-radius: 4px 4px 2px 2px; background: linear-gradient(180deg, #0A84FF, #5AA9FF);
    transform-origin: bottom; animation: grow 1.1s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i) * 60ms + .4s);
  }
  .crm-chart span:nth-child(even) { opacity: .55; }
  @keyframes grow { from { transform: scaleY(0); } }

  footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: .82rem; font-weight: 500; }
  footer b { color: var(--text); font-weight: 700; letter-spacing: -.02em; }

  /* ---------- Buttons ---------- */
  .btn, .hero-cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border-radius: 999px; text-decoration: none;
    background: var(--accent); color: #fff; font: 500 .92rem var(--font); letter-spacing: -.01em;
    border: none; cursor: pointer; transition: transform .3s cubic-bezier(.3, .9, .3, 1), background .3s;
  }
  .btn:hover, .hero-cta:hover { transform: scale(1.04); background: var(--accent-hover); }
  .btn:active, .hero-cta:active { transform: scale(.98); }
  .btn.sm { padding: 9px 18px; font-size: .82rem; }
  .btn.dark { background: #000; color: #fff; }
  [data-theme="dark"] .btn.dark { background: #F5F5F7; color: #000; }
  .btn.dark:hover { background: #1D1D1F; }
  [data-theme="dark"] .btn.dark:hover { background: #fff; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .btn-row.sm { margin-top: 0; gap: 8px; }

  /* ---------- Modal ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 20px; background: var(--overlay); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  .overlay.open { display: grid; }
  .modal {
    position: relative; width: min(780px, 100%); max-height: 90vh; overflow: auto;
    background: var(--modal-bg); border: 1px solid var(--line); border-radius: 28px;
    padding: 44px 44px 32px; box-shadow: 0 30px 90px rgba(0, 0, 0, .28); color: var(--text);
  }
  .modal .tag { display: block; margin-bottom: 10px; color: var(--accent); }
  .modal h2 { font-size: clamp(1.9rem, 4vw, 2.7rem); line-height: 1.06; font-weight: 800; margin-bottom: 14px; padding-right: 44px; }
  .modal .lead { color: var(--text); font-size: 1.22rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.35; margin-bottom: 16px; }
  .modal p { color: var(--body); font-weight: 400; font-size: 1rem; line-height: 1.7; margin-bottom: 12px; }
  .modal h4 { font-size: .78rem; letter-spacing: .02em; color: var(--muted); font-weight: 600; margin: 28px 0 10px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat { border-radius: 18px; padding: 16px 18px; background: var(--fill); }
  .stat.wide { grid-column: 1 / -1; background: var(--obsidian); color: var(--obs-text); }
  .stat.wide b { font-size: 1.15rem; letter-spacing: -.02em; color: var(--obs-text); }
  .stat b { display: block; font-size: 1.9rem; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .78rem; color: var(--muted); font-weight: 500; }
  .steps { list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; position: relative; padding: 13px 0 13px 46px; border-bottom: 1px solid var(--line); color: var(--body); font-size: .96rem; }
  .steps li:last-child { border-bottom: none; }
  .steps li::before {
    content: counter(s); position: absolute; left: 0; top: 14px; width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: .8rem; font-weight: 700; display: grid; place-items: center;
  }
  .steps li b { display: block; color: var(--text); font-weight: 600; letter-spacing: -.01em; }
  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { font-size: .8rem; font-weight: 500; border-radius: 999px; padding: 5px 14px; background: var(--fill); color: var(--body); }
  .modal-cta { margin-top: 24px; }

  /* Calculator */
  .calc-group { margin-bottom: 18px; }
  .calc-group > label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt { border: 1px solid var(--line); border-radius: 12px; background: transparent; color: var(--text); padding: 10px 16px; font: 500 .86rem var(--font); cursor: pointer; transition: .25s; }
  .opt:hover { border-color: var(--line-hi); transform: scale(1.02); }
  .opt.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .range-val { float: right; color: var(--text); font-weight: 600; }
  .estimate { margin-top: 20px; padding: 22px 24px; border-radius: 20px; background: var(--obsidian); color: var(--obs-text); }
  .estimate small { display: block; font-size: .78rem; font-weight: 600; color: var(--obs-muted); }
  .estimate .sum { font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .estimate em { display: block; font-size: .78rem; color: var(--obs-muted); font-style: normal; margin-top: 4px; }

  .modal-close {
    position: absolute; top: 18px; right: 18px; width: 34px; height: 34px; border-radius: 50%;
    border: none; background: var(--fill); color: var(--text); font-size: 1.25rem; line-height: 1; cursor: pointer; transition: transform .3s, background .3s;
  }
  .modal-close:hover { transform: scale(1.1) rotate(90deg); }
  .modal-nav { display: flex; justify-content: space-between; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
  .nav-btn { background: none; border: none; color: var(--accent); font: 500 .92rem var(--font); cursor: pointer; padding: 6px 2px; }
  .nav-btn:hover { opacity: .7; }
  .modal-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; font-size: .8rem; font-weight: 500; color: var(--muted); }
  .modal-foot a { text-decoration: none; } .modal-foot a:hover { color: var(--accent); }

  /* ---------- Tablet ---------- */
  @media (max-width: 1099px) { .bento { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 720px) { .status { display: none; } }

  /* ---------- Mobile: single column, scrollable ---------- */
  @media (max-width: 580px) {
    .bento { grid-template-columns: 1fr; grid-auto-rows: auto; }
    .card, .w2 { grid-column: span 1; min-height: 176px; } .h2 { grid-row: auto; min-height: 400px; }
    .art { min-height: 150px; }
    .modal { padding: 36px 22px 22px; } .hero-card { padding: 24px; }
    .brand small { display: none; } .top-in { padding: 10px 16px; }
    .wrap { padding: 0 16px 60px; }
    .eyebrow { display: none; }
    .filters { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .chip { white-space: nowrap; }
  }

  /* ---------- Desktop: single-screen dashboard (no page scroll) ---------- */
  @media (min-width: 1100px) and (min-height: 600px) {
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; min-height: 0; }
    header.top { flex: none; }
    .top-in { padding: clamp(7px, 1.2vh, 12px) 24px; }
    .wrap { flex: 1; min-height: 0; width: 100%; display: flex; flex-direction: column; padding: 0 24px clamp(10px, 2vh, 18px); }
    .filterbar { flex: none; margin: clamp(8px, 1.6vh, 14px) 0; }
    .chip { padding: clamp(5px, 1vh, 8px) 15px; font-size: clamp(.74rem, 1.6vh, .84rem); }
    footer { display: none; }

    .bento {
      flex: 1; min-height: 0; gap: clamp(8px, 1.4vh, 14px);
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1.15fr) minmax(0, 1.15fr) minmax(0, .62fr) minmax(0, 1fr);
      grid-auto-rows: minmax(0, 1fr); grid-auto-flow: row;
    }
    .card {
      padding: clamp(12px, 2.1vh, 22px); gap: clamp(4px, 1vh, 10px);

  const bySlide = Object.fromEntries(SLIDES.map(s => [s.id, s]));
  const $ = (sel, root = document) => root.querySelector(sel);
  const fmt = n => String(n).replace(".", lang === "ru" ? "," : ".");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const hasFlip = typeof Flip !== "undefined";
  const hasST = typeof ScrollTrigger !== "undefined";
  gsap.registerPlugin(...[hasFlip && Flip, hasST && ScrollTrigger].filter(Boolean));

  /* ---------- Static text ---------- */
  function applyStatic() {
    document.documentElement.lang = lang;
    document.documentElement.dataset.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => (el.textContent = u(el.dataset.i18n)));
    document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", u(el.dataset.i18nAria)));
    document.querySelectorAll("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  }

  /* ---------- Theme ---------- */
  const root = document.documentElement, themeBtn = $("#themeBtn");
  function setTheme(t, animate) {
    root.dataset.theme = t;
    themeBtn.setAttribute("aria-pressed", String(t === "dark"));
    try { localStorage.setItem("rs-theme", t); } catch (e) {}
    if (animate && !reduced) gsap.fromTo(themeBtn, { rotate: -90, scale: .75 }, { rotate: 0, scale: 1, duration: .55, ease: "back.out(2)" });
  }
  let savedTheme = null;
  try { savedTheme = localStorage.getItem("rs-theme"); } catch (e) {}
  setTheme(savedTheme === "dark" ? "dark" : "light");
  themeBtn.addEventListener("click", () => setTheme(root.dataset.theme === "dark" ? "light" : "dark", true));

  /* ---------- Render ---------- */
  const bento = $("#bento"), filtersEl = $("#filters");
  let currentTool = TOOLS[0].n;

  const heroH1 = s => tr(s.title).split(" ").map(w => `<span class="w"><span>${w}</span></span>`).join(" ");

  function cardHTML(s) {
    if (s.adv) {
      return `
        <div class="row"><span class="tag">${tr(s.tag)}</span></div>
        <h1>${heroH1(s)}</h1>
        <p class="lead">${u("heroLead")}</p>
        <div class="adv">${advList().map(a => `<span>${a}</span>`).join("")}</div>
        <div class="hero-foot"><button class="hero-cta" data-open="contact" type="button">${u("heroCta")}</button></div>`;
    }
    if (s.tools) {
      const t = TOOLS.find(x => x.n === currentTool);
      return `
        <div class="row"><span class="tag">${tr(s.tag)}</span><h3>${tr(s.title)}</h3></div>
        <div class="tools">${TOOLS.map(x => `<button class="tool${x.n === currentTool ? " on" : ""}" type="button" data-tool="${x.n}">${x.n}</button>`).join("")}</div>
        <p class="tool-note" id="toolNote">${t ? tr(t.d) : u("toolHint")}</p>
        <span class="more" aria-hidden="true">↗</span>`;
    }
    if (s.calc) {
      return `
        <div class="row">${ICONS[s.icon]}<span class="tag">${tr(s.tag)}</span></div>
        <div><h3>${tr(s.title)}</h3><p class="sub">${tr(s.sub)}</p></div>
        <div class="btn-row sm">
          <button class="btn sm" data-open="contact" type="button">${u("getEst")}</button>
          <a class="btn sm ghostw" href="${CONTACT.telegram}" target="_blank" rel="noopener">Telegram</a>
        </div>
        <span class="more" aria-hidden="true">↗</span>`;
    }
    const art = s.art === "crm" ? CRM_ART : s.art ? `<div class="art art-${s.art}"><i></i><i></i><i></i></div>` : "";
    return `
      <div class="row">${s.icon ? ICONS[s.icon] : ""}<span class="tag">${tr(s.tag)}</span>${s.badge ? `<span class="badge">${tr(s.badge)}</span>` : ""}</div>
      ${art}
      <div><h3>${tr(s.title)}</h3><p class="sub">${tr(s.sub)}</p></div>
      <span class="more" aria-hidden="true">↗</span>`;
  }

  const cards = SLIDES.map(s => {
    const el = document.createElement("article");
    el.className = `card ${s.size || ""} ${s.style || ""}`.replace(/\s+/g, " ").trim();
    el.dataset.id = s.id;
    el.dataset.cat = s.cat;
    el.tabIndex = 0;
    el.setAttribute("role", "button");
    bento.appendChild(el);
    return el;
  });

  function renderCards() {
    cards.forEach(el => {
      const s = bySlide[el.dataset.id];
      el.innerHTML = cardHTML(s);
      el.setAttribute("aria-label", `${tr(s.tag)}: ${tr(s.title)}`);
    });
  }

  let current = "all";
  const matches = (c, cat) => cat === "all" || c.dataset.cat.split(" ").includes(cat);

  function renderChips() {
    filtersEl.innerHTML = CATEGORIES.map(c => {
      const n = c.id === "all" ? SLIDES.length : SLIDES.filter(s => s.cat.split(" ").includes(c.id)).length;
      return `<button class="chip${c.id === current ? " active" : ""}" type="button" data-filter="${c.id}">${tr(c.label)}<span class="count">${n}</span></button>`;
    }).join("");
  }

  renderCards();
  renderChips();
  applyStatic();

  /* ---------- Scroll reveal (GSAP + ScrollTrigger) ---------- */
  function reveal(els) {
    els = els.filter(e => !e.dataset.rv);
    els.forEach(e => (e.dataset.rv = 1));
    if (!els.length) return;
    gsap.to(els, { opacity: 1, y: 0, duration: .85, ease: "power3.out", stagger: .07, overwrite: "auto", clearProps: "opacity,transform" });
  }

  function intro() {
    if (reduced) { cards.forEach(c => (c.dataset.rv = 1)); return; }
    gsap.set(cards, { opacity: 0, y: 44 });
    gsap.from([".brand", ".top-right", ".filterbar > *"], { y: 14, opacity: 0, duration: .8, stagger: .06, ease: "power3.out" });
    gsap.from(".hero-card h1 .w > span", { yPercent: 110, duration: 1, stagger: .05, ease: "expo.out", delay: .35 });
    if (hasST) ScrollTrigger.batch(cards, { start: "top 98%", once: true, onEnter: reveal });
    else reveal(cards);
  }

  /* ---------- Filtering (Flip) ---------- */
  filtersEl.addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn || btn.dataset.filter === current) return;
    current = btn.dataset.filter;
    filtersEl.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === btn));
    const apply = () => {
      bento.dataset.f = current;
      cards.forEach(c => (c.style.display = matches(c, current) ? "" : "none"));
    };
    const shown = () => cards.filter(c => c.style.display !== "none");
    if (reduced || !hasFlip) { apply(); return reveal(shown()); }
    const state = Flip.getState(cards);
    apply();
    Flip.from(state, {
      duration: .75, ease: "power3.inOut", absolute: true, nested: true,
      onEnter: els => { els.forEach(e => (e.dataset.rv = 1)); return gsap.fromTo(els, { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, y: 0, duration: .6, delay: .15 }); },
      onLeave: els => gsap.to(els, { opacity: 0, scale: .9, duration: .4 }),
      onComplete: () => { reveal(shown()); if (hasST) ScrollTrigger.refresh(); }
    });
  });

  /* ---------- Hover micro-interactions ---------- */
  if (!reduced) {
    cards.forEach(c => {
      c.addEventListener("pointerenter", () => gsap.to(c, { y: -4, duration: .35, ease: "power2.out", overwrite: "auto" }));
      c.addEventListener("pointerleave", () => gsap.to(c, { y: 0, duration: .45, ease: "power2.out", overwrite: "auto" }));
    });
  }

  /* Interactive stack inside the card */
  function showTool(name) {
    const t = TOOLS.find(x => x.n === name);
    if (!t) return;
    currentTool = name;
    document.querySelectorAll(".tool").forEach(b => b.classList.toggle("on", b.dataset.tool === name));
    const note = $("#toolNote");
    if (!note) return;
    note.textContent = tr(t.d);
    if (!reduced) gsap.fromTo(note, { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: .4, ease: "power2.out" });
  }

  /* ---------- Modal ---------- */
  const overlay = $("#overlay"), modal = $("#modal");
  let lastFocus = null, activeId = null, busy = false;

  function fill(id) {
    const s = bySlide[id];
    activeId = id;
    $("#mTag").textContent = tr(s.tag);
    $("#mTitle").textContent = tr(s.title);
    let html = `<p class="lead">${tr(s.lead)}</p>`;
    (s.body || []).forEach(p => (html += `<p>${tr(p)}</p>`));
    if (s.adv) html += `<h4>${u("advH")}</h4><div class="pill-row">${advList().map(a => `<span class="pill">${a}</span>`).join("")}</div>`;
    if (s.steps) html += `<h4>${u("process")}</h4><ol class="steps">${s.steps.map(t => `<li><b>${tr(t.t)}</b>${tr(t.d)}</li>`).join("")}</ol>`;
    if (s.stats) html += `<h4>${u("results")}</h4><div class="stats">${s.stats.map(t => t.txt
      ? `<div class="stat wide"><b>${tr(t.txt)}</b></div>`
      : `<div class="stat"><b data-v="${t.v}" data-s="${tr(t.s)}">${fmt(t.v)}${tr(t.s)}</b><span>${tr(t.l)}</span></div>`).join("")}</div>`;
    if (s.tools) html += `<h4>${u("toolsH")}</h4><ol class="steps">${TOOLS.map(t => `<li><b>${t.n}</b>${tr(t.d)}</li>`).join("")}</ol>`;
    if (s.pills) html += `<h4>${u("stackH")}</h4><div class="pill-row">${s.pills.map(p => `<span class="pill">${p}</span>`).join("")}</div>`;
    html += s.calc ? calcHTML() : `<div class="modal-cta"><button class="btn" type="button" data-open="contact">${u("discuss")}</button></div>`;
    $("#mBody").innerHTML = html;
    if (s.calc) initCalc();
  }

  function animateContent() {
    if (reduced) return;
    gsap.from("#mTag, #mTitle, #mBody > *, #mBody li, #mBody .stat", { y: 16, opacity: 0, duration: .55, stagger: .035, ease: "power3.out", delay: .08, clearProps: "opacity,transform" });
    modal.querySelectorAll(".stat b[data-v]").forEach(b => {
      const o = { v: 0 }, t = parseFloat(b.dataset.v), sfx = b.dataset.s;
      gsap.to(o, { v: t, duration: 1.1, delay: .3, ease: "power2.out", onUpdate() { b.textContent = fmt(Math.round(o.v * 10) / 10) + sfx; } });
    });
  }

  const visibleIds = () => cards.filter(c => c.style.display !== "none").map(c => c.dataset.id);

  function openModal(id, trigger) {
    if (busy) return;
    if (overlay.classList.contains("open")) return swap(id);
    lastFocus = trigger || document.activeElement;
    fill(id);
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    if (reduced) return $("#mClose").focus();
    busy = true;
    gsap.fromTo(overlay, { opacity: 0 }, { opacity: 1, duration: .3 });
    gsap.fromTo(modal, { y: 50, scale: .95, opacity: 0 }, {
      y: 0, scale: 1, opacity: 1, duration: .55, ease: "expo.out",
      onComplete() { busy = false; $("#mClose").focus(); }
    });
    animateContent();
  }

  function closeModal() {
    if (!overlay.classList.contains("open") || busy) return;
    const done = () => {
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      busy = false;
      if (lastFocus) lastFocus.focus({ preventScroll: true });
    };
    if (reduced) return done();
    busy = true;
    gsap.to(modal, { y: 24, scale: .97, opacity: 0, duration: .28, ease: "power2.in" });
    gsap.to(overlay, { opacity: 0, duration: .32, onComplete: done });
  }

  function swap(id, dir = 1) {
    const targets = "#mBody, #mTitle, #mTag";
    const apply = () => { fill(id); modal.scrollTop = 0; };
    if (reduced) return apply();
    gsap.to(targets, {
      x: -dir * 28, opacity: 0, duration: .22, ease: "power2.in",
      onComplete() { apply(); gsap.set(targets, { x: 0, opacity: 1 }); animateContent(); }
    });
  }

  function step(dir) {
    const ids = visibleIds();
    const i = ids.indexOf(activeId);
    swap(ids[(i + dir + ids.length) % ids.length], dir);
  }

  /* ---------- Estimate calculator ---------- */
  const PRICING = {
    type: { tilda: { label: L("Tilda Zero Block project", "Проект на Tilda Zero Block"), usd: [1200, 2500], eur: [1100, 2300] },
            uiux: { label: L("UI/UX design & prototyping", "UI/UX дизайн и прототипирование"), usd: [1500, 3500], eur: [1400, 3200] },
            dev: { label: L("Custom dev / Enterprise CRM dashboard", "Кастомная разработка / Enterprise CRM-дашборд"), usd: [2500, 6000], eur: [2300, 5500] } },
    anim: { basic: { label: L("Subtle", "Базовые"), w: 0 }, adv: { label: L("Advanced", "Продвинутые"), w: .5 }, wow: { label: L("Showpiece", "Wow-эффекты"), w: 1 } },
    rush: { no: { label: L("Standard", "Стандартные"), k: 1 }, yes: { label: L("Rush", "Срочно"), k: 1.2 } }
  };
  const calc = { type: "tilda", anim: "adv", rush: "no", screens: 5, shown: null };

  function optGroup(label, group) {
    return `<div class="calc-group"><label>${label}</label><div class="opts">${
      Object.entries(PRICING[group]).map(([k, v]) => `<button type="button" class="opt${calc[group] === k ? " on" : ""}" data-group="${group}" data-val="${k}">${tr(v.label)}</button>`).join("")
    }</div></div>`;
  }

  function calcHTML() {
    return `
      <h4>${u("calcH")}</h4>
      ${optGroup(u("gType"), "type")}
      <div class="calc-group"><label>${u("gScreens")} <span class="range-val" id="screensVal">${calc.screens}</span></label>
        <input type="range" id="screens" min="1" max="20" value="${calc.screens}"></div>
      ${optGroup(u("gAnim"), "anim")}
      ${optGroup(u("gRush"), "rush")}
      <div class="estimate">
        <small>${u("estLabel")}</small>
        <div class="sum" id="sum">—</div>
        <em>${u("estNote")}</em>
      </div>
      <div class="btn-row">
        <a class="btn" href="${CONTACT.telegram}" target="_blank" rel="noopener">${u("tg")}</a>
        <a class="btn dark" id="mailBtn" href="mailto:${CONTACT.email}">${CONTACT.email}</a>
      </div>`;
  }

  function estimate() {
    const t = PRICING.type[calc.type];
    const [min, max] = lang === "ru" ? t.eur : t.usd;
    const s = .1 + .55 * ((calc.screens - 1) / 19) + .35 * PRICING.anim[calc.anim].w;
    const rush = PRICING.rush[calc.rush].k;
    const pick = x => Math.round((min + (max - min) * Math.min(1, Math.max(0, x))) * rush / 50) * 50;
    return { lo: pick(s - .2), hi: pick(s + .2), open: calc.type === "dev" && s + .2 >= 1 };
  }

  const currency = () => (lang === "ru" ? "EUR" : "USD");
  const money = n => `${lang === "ru" ? "€" : "$"}${Math.round(n).toLocaleString("en-US")}`;
  const range = (a, b, open) => `${money(a)} – ${money(b)}${open ? "+" : ""} ${currency()}`;

  function updateEstimate(animate = true) {
    const sum = $("#sum");
    if (!sum) return;
    const { lo, hi, open } = estimate();
    const render = (a, b) => (sum.textContent = range(a, b, open));
    const mail = $("#mailBtn");
    if (mail) {
      const body = `${tr(PRICING.type[calc.type].label)}\n${u("gScreens")}: ${calc.screens}\n${u("gAnim")}: ${tr(PRICING.anim[calc.anim].label)}\n${u("gRush")}: ${tr(PRICING.rush[calc.rush].label)}\n${u("estLabel")}: ${range(lo, hi, open)}`;
      mail.href = `mailto:${CONTACT.email}?subject=${encodeURIComponent(tr(PRICING.type[calc.type].label))}&body=${encodeURIComponent(body)}`;
    }
    if (reduced || !animate) { calc.shown = { lo, hi }; return render(lo, hi); }
    const from = calc.shown || { lo: 0, hi: 0 };
    const o = { a: from.lo, b: from.hi };
    gsap.to(o, { a: lo, b: hi, duration: .7, ease: "power2.out", overwrite: true, onUpdate: () => render(o.a, o.b) });
    calc.shown = { lo, hi };
  }

  function initCalc() {
    calc.shown = null;
    $("#mBody").onclick = e => {
      const o = e.target.closest(".opt");
      if (!o) return;
      calc[o.dataset.group] = o.dataset.val;
      o.parentElement.querySelectorAll(".opt").forEach(b => b.classList.toggle("on", b === o));
      updateEstimate();
    };
    $("#screens").addEventListener("input", e => {
      calc.screens = +e.target.value;
      $("#screensVal").textContent = calc.screens;
      updateEstimate();
    });
    updateEstimate();
  }

  /* ---------- Language switch ---------- */
  function setLang(l) {
    if (l === lang) return;
    lang = l;
    try { localStorage.setItem("rs-lang", l); } catch (e) {}
    applyStatic();
    renderChips();
    renderCards();
    if (overlay.classList.contains("open")) fill(activeId);
    if (!reduced) gsap.from(".card h3, .card .sub, .card h1, .card .lead, .adv span, .tool-note", { y: 8, opacity: 0, duration: .45, stagger: .012, ease: "power2.out", clearProps: "opacity,transform" });
  }
  $("#langSeg").addEventListener("click", e => {
    const b = e.target.closest("button[data-lang]");
    if (b) setLang(b.dataset.lang);
  });

  /* ---------- Events ---------- */
  bento.addEventListener("click", e => {
    if (e.target.closest("a")) return;
    const tool = e.target.closest(".tool");
    if (tool) return showTool(tool.dataset.tool);
    const cta = e.target.closest("[data-open]");
    if (cta) { e.stopPropagation(); return openModal(cta.dataset.open, cta); }
    const c = e.target.closest(".card");
    if (c) openModal(c.dataset.id, c);
  });
  bento.addEventListener("keydown", e => {
    if (e.target.closest(".tool, .hero-cta, .btn")) return;
    const c = e.target.closest(".card");
    if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openModal(c.dataset.id, c); }
  });
  modal.addEventListener("click", e => {
    const cta = e.target.closest("[data-open]");
    if (cta) openModal(cta.dataset.open, lastFocus);
  });
  $("#mClose").addEventListener("click", closeModal);
  $("#mPrev").addEventListener("click", () => step(-1));
  $("#mNext").addEventListener("click", () => step(1));
  overlay.addEventListener("mousedown", e => { if (e.target === overlay) closeModal(); });
  document.addEventListener("keydown", e => {
    if (!overlay.classList.contains("open")) return;
    const typing = e.target.matches("input");
    if (e.key === "Escape") closeModal();
    else if (e.key === "ArrowRight" && !typing) step(1);
    else if (e.key === "ArrowLeft" && !typing) step(-1);
    else if (e.key === "Tab") {
      const f = [...modal.querySelectorAll("button, a[href], input")];
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  intro();
})();
</script>
</body>
</html>
